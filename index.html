<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#2c3f51">
	<link rel="shortcut icon" href="https://i.pinimg.com/1200x/17/49/0d/17490d730812a5fb6436973a3e4907d9.jpg"
		type="image/x-icon">
	<link rel="stylesheet" href="src/css/style.css">
	<script defer src="src/js/globalConfig.js"></script>
	<script defer src="src/js/state.js"></script>
	<script defer src="src/js/PERF.js"></script>
	<script defer src="src/js/utils.js"></script>
	<script defer src="src/js/3dModels.js"></script>
	<script defer src="src/js/Entity.js"></script>
	<script defer src="src/js/getTarget.js"></script>
	<script defer src="src/js/createBurst.js"></script>
	<script defer src="src/js/sparks.js"></script>
	<script defer src="src/js/hud.js"></script>
	<script defer src="src/js/menus.js"></script>
	<script defer src="src/js/actions.js"></script>
	<title>Brick Slider By Mmabiaa</title>
</head>

<body>
	<canvas id="c"></canvas>

	<!-- Gameplay HUD -->
	<div class="hud">
		<div class="hud__score">
			<div class="score-lbl"></div>
			<div class="cube-count-lbl"></div>
		</div>
		<div class="pause-btn">
			<div></div>
		</div>
		<div class="slowmo">
			<div class="slowmo__bar"></div>
		</div>
	</div>

	<div class="menus">
		<div class="menu menu--main">
			<h1>BRICK-SLIDER</h1>
			<button type="button" class="play-normal-btn">PLAY GAME</button>
			<button type="button" class="play-casual-btn">CASUAL MODE</button>
			<div class="credits">Game by <a href="https://mmabiaa.vercel.app">Mmabiaa</a></div>
		</div>
		<div class="menu menu--pause">
			<h1>Paused</h1>
			<button type="button" class="resume-btn">RESUME GAME</button>
			<button type="button" class="menu-btn--pause">MAIN MENU</button>
		</div>
		<div class="menu menu--score">
			<h1>Game Over</h1>
			<h2>Your Score:</h2>
			<div class="final-score-lbl"></div>
			<div class="high-score-lbl"></div>
			<button type="button" class="play-again-btn">PLAY AGAIN</button>
			<button type="button" class="menu-btn--score">MAIN MENU</button>
		</div>
	</div>
</body>

</html>
